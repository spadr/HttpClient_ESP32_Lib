; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = test_unit

; ===== COMMON CONFIGURATIONS =====

; ---------- PC Native Common ----------
[common_native]
platform = native
build_flags = -std=gnu++17
              -DNATIVE_TEST
              -DARDUINO_ARCH_NATIVE
              -Itest/helpers
              -Itest/fixtures
              -Itest
              -DUNITY_INCLUDE_CONFIG_H
build_src_filter = +<utils/*> 
                   +<native_arduino_compat.*>
                   +<core/HttpResult.h>
                   +<Result.h>
                   +<cookie/*>
                   +<auth/*>
                   +<core/Request.*>
                   +<core/RequestValidator.*>
                   +<core/mock/*>
                   +<core/WiFiSecureConnectionMock.cpp>
                   -<core/WiFiSecureConnection.cpp>
                   +<core/HttpClient.cpp>
                   +<HttpClient.h>
                   +<core/ConnectionPool.*>
                   +<core/Response.*>
                   +<core/Connection.h>
                   +<core/CommonTypes.h>
test_build_src = yes
lib_deps = throwtheswitch/Unity@^2.5.2

; ======= TEST ENVIRONMENTS =======

; 1. Unit Tests (PC: Fastest)
[env:test_unit]
extends = common_native
test_filter = test/unit/utils/test_utils.cpp
              test/unit/cookie/test_cookie.cpp
              test/unit/auth/test_auth.cpp
              test/unit/core/test_request_validator.cpp
              test/unit/basic/test_basic.cpp
build_flags = ${common_native.build_flags}
              -DUNIT_TEST

; 2. Integration Tests (PC + MockServer)
[env:test_integration]
extends = common_native
test_filter = test/integration/http_basic/test_basic_http.cpp
              test/integration/test_http_protocol.cpp
build_flags = ${common_native.build_flags}
              -DINTEGRATION_TEST

; ======= PRODUCTION ENVIRONMENTS =======

[env:m5stack-atom]
platform = espressif32 @ 6.7.0
upload_speed = 1500000
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_unflags = -std=gnu++11
build_flags = -std=gnu++2a
                -DCORE_DEBUG_LEVEL=10
                -DCONFIG_H_EXISTS

board = m5stack-atom
framework = arduino
lib_deps =
    bblanchon/ArduinoJson@^6.19.4
test_build_src = yes


[env:m5stack-atom-ex]
platform = espressif32 @ 6.8.1
upload_speed = 1500000
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_unflags = -std=gnu++11
build_flags = -std=gnu++2a
                -DCORE_DEBUG_LEVEL=10

board = m5stack-atom
framework = arduino
