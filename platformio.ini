; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = test_unit

; ===== COMMON CONFIGURATIONS =====

; ---------- PC Native Common ----------
[common_native]
platform = native
build_flags = -std=gnu++17
              -DNATIVE_TEST
              -DARDUINO_ARCH_NATIVE
              -Itest/helpers
              -Itest/fixtures
              -Itest
              -DUNITY_INCLUDE_CONFIG_H
build_src_filter = +<utils/*> 
                   +<native_arduino_compat.*>
                   +<core/HttpResult.h>
                   +<Result.h>
                   +<cookie/*>
                   +<auth/*>
                   +<core/Request.*>
                   +<core/RequestValidator.*>
                   +<core/mock/*>
                   +<core/WiFiSecureConnectionMock.cpp>
                   -<core/WiFiSecureConnection.cpp>
                   +<core/HttpClient.cpp>
                   +<HttpClient.h>
                   +<core/ConnectionPool.*>
                   +<core/Response.*>
                   +<core/Connection.h>
                   +<core/CommonTypes.h>
                   -<ConfigExample.h> ; Removed as it's a header with extern declarations
                   +<Config.cpp>      ; Added the .cpp file with definitions
                   +<test/helpers/TestEnvironment.*>
                   +<proxy/*>
                   +<app/*>
                   +<native/main.cpp>
test_build_src = yes
lib_deps = throwtheswitch/Unity@^2.5.2

; ---------- ESP32 Common ----------  
[common_esp32]
platform = espressif32
board = m5stack-atom
framework = arduino
upload_speed = 1500000
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
              -DCORE_DEBUG_LEVEL=5
              -DCONFIG_H_EXISTS
build_src_filter = +<*> -<native/*> -<main.cpp> -<esp32_main.cpp> +<esp32/main.cpp> +<Config.cpp> ; Re-included src/esp32/main.cpp
test_build_src = yes
lib_deps = 
    bblanchon/ArduinoJson@^6.19.4
    throwtheswitch/Unity@^2.5.2

; ======= TEST ENVIRONMENTS =======

; 1. Unit Tests (PC: Fastest)
[env:test_unit]
extends = common_native
test_filter = test/unit/utils/test_utils.cpp
              test/unit/cookie/test_cookie.cpp
              test/unit/auth/test_auth.cpp
              test/unit/core/test_request_validator.cpp
              test/unit/basic/test_basic.cpp
              test/unit/test_native_arduino_mock.cpp
              test/unit/validation/test_validate_esp32_tests.cpp
              test/unit/cookie/test_cookie_jar.cpp
              test/unit/utils/test_unit_utils.cpp
build_flags = ${common_native.build_flags}
              -DUNIT_TEST

; 2. Integration Tests (PC + MockServer)
[env:test_integration]
extends = common_native
test_filter = test/integration/http_basic/test_basic_http.cpp
              test/integration/test_http_protocol.cpp
build_flags = ${common_native.build_flags}
              -DINTEGRATION_TEST

; 3. E2E Tests (ESP32 Real Hardware)
[env:test_esp32]
extends = common_esp32
test_filter = test/test_e2e_esp32.cpp
build_flags = ${common_esp32.build_flags}
              -DE2E_TEST

; ======= PRODUCTION ENVIRONMENTS =======

; ESP32 Production Build
[env:m5stack-atom]
extends = common_esp32
build_flags = ${common_esp32.build_flags}
              -DPRODUCTION

; ESP32 Extended (Alternative config)
[env:m5stack-atom-ex]
extends = common_esp32
build_flags = ${common_esp32.build_flags}
              -DPRODUCTION
              -DEXTENDED_CONFIG

; ======= LEGACY ENVIRONMENTS (backward compatibility) =======

[env:native]
extends = common_native
test_filter = test_native_basic.cpp
test_ignore = test_e2e_esp32.cpp, test_unit_utils.cpp, e2e/*, integration/*, unit/*
build_flags = ${common_native.build_flags}
              -DUNIT_TEST

[env:native_integration]
extends = env:test_integration