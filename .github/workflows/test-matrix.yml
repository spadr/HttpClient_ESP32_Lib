name: Test Matrix

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    name: Unit Tests
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Cache PlatformIO
      uses: actions/cache@v3
      with:
        path: ~/.platformio
        key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}
        restore-keys: |
          ${{ runner.os }}-pio-
          
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade platformio
        
    - name: Run Unit Tests
      run: pio test -e native --verbose
      
  integration-tests:
    runs-on: ubuntu-latest
    name: Integration Tests
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Cache PlatformIO
      uses: actions/cache@v3
      with:
        path: ~/.platformio
        key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}
        restore-keys: |
          ${{ runner.os }}-pio-
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade platformio
        
    - name: Start Mock Services
      run: |
        cd docker
        docker-compose -f test-services.yml up -d
        sleep 30
        
    - name: Wait for Services to be Ready
      run: |
        echo "Waiting for MockServer..."
        timeout 60 bash -c 'until curl -f http://localhost:1080/mockserver/status > /dev/null 2>&1; do sleep 2; done'
        echo "Waiting for WireMock..."
        timeout 60 bash -c 'until curl -f http://localhost:8080/__admin/ > /dev/null 2>&1; do sleep 2; done'
        echo "All services are ready"
        
    - name: Run Integration Tests
      run: pio test -e native_integration --verbose
      
    - name: Show Service Logs (if tests fail)
      if: failure()
      run: |
        echo "=== MockServer Logs ==="
        docker-compose -f docker/test-services.yml logs mockserver
        echo "=== WireMock Logs ==="
        docker-compose -f docker/test-services.yml logs wiremock
        echo "=== Proxy Logs ==="
        docker-compose -f docker/test-services.yml logs proxy
        
    - name: Stop Mock Services
      if: always()
      run: |
        cd docker
        docker-compose -f test-services.yml down
        
  security-scan:
    runs-on: ubuntu-latest
    name: Security Scan
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Run CodeQL Analysis
      uses: github/codeql-action/init@v2
      with:
        languages: cpp
        
    - name: Autobuild
      uses: github/codeql-action/autobuild@v2
      
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v2
      
    - name: Run Bandit Security Linter
      run: |
        pip install bandit
        # Python scriptsがある場合のみ実行
        if [ -f "test_runner.py" ] || [ -f "scripts/*.py" ]; then
          bandit -r . -f json -o bandit-report.json || true
        fi
        
  build-tests:
    runs-on: ubuntu-latest
    name: Build Tests
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Cache PlatformIO
      uses: actions/cache@v3
      with:
        path: ~/.platformio
        key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}
        restore-keys: |
          ${{ runner.os }}-pio-
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade platformio
        
    - name: Build for ESP32 (M5Stack Atom)
      run: pio run -e m5stack-atom
      
    - name: Build for ESP32 (M5Stack Atom Extended)
      run: pio run -e m5stack-atom-ex
      
  test-summary:
    runs-on: ubuntu-latest
    name: Test Summary
    needs: [unit-tests, integration-tests, security-scan, build-tests]
    if: always()
    
    steps:
    - name: Test Results Summary
      run: |
        echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
        echo "| Test Type | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Unit Tests | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Integration Tests | ${{ needs.integration-tests.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Security Scan | ${{ needs.security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Build Tests | ${{ needs.build-tests.result }} |" >> $GITHUB_STEP_SUMMARY
        
        if [ "${{ needs.unit-tests.result }}" == "success" ] && [ "${{ needs.integration-tests.result }}" == "success" ] && [ "${{ needs.security-scan.result }}" == "success" ] && [ "${{ needs.build-tests.result }}" == "success" ]; then
          echo "✅ All tests passed!"
          exit 0
        else
          echo "❌ Some tests failed!"
          exit 1
        fi