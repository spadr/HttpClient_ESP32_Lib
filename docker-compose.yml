version: '3.8'

services:
  # MockServer for Layer 2 Integration Tests
  mockserver:
    image: mockserver/mockserver:5.15.0
    ports:
      - "1080:1080"
    environment:
      - MOCKSERVER_LOG_LEVEL=INFO
      - MOCKSERVER_SERVER_PORT=1080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1080/mockserver/status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - test-network

  # HTTP Test Server (alternative to MockServer)
  httpbin:
    image: kennethreitz/httpbin
    ports:
      - "8080:80"
    networks:
      - test-network

  # Optional: WireMock alternative
  wiremock:
    image: wiremock/wiremock:latest
    ports:
      - "8081:8080"
    command: ["--global-response-templating", "--verbose"]
    volumes:
      - ./test/fixtures/wiremock:/home/wiremock
    networks:
      - test-network

networks:
  test-network:
    driver: bridge